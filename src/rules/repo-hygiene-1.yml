--- 
name: Repo hygiene 1
description: Check for repo hygiene, e.g. size, number of branches, etc.
priority: 1

conditions:
  all:
    - fact: name
      operator: equal
      value: issue
      description: the source is an 'issue'

    - fact: payload.action
      operator: equal
      value: opened
      description: incoming event was an 'opened'

event:
  type: repositoryHygiene
  params:
    reports: 
      - scorecard_markdown
    
    name: 2nd_rule
    
    checks:
      - name: repository_size
        description: Repo size
        condition:
          operator: greaterThan
          value: 10
        level: warning
        weight: 1
        message: Repo has too many branches

      - name: number_of_branches
        description: Repo branches
        condition:
          operator: greaterThan
          value: 10
        level: warning
        weight: 0.5
        message: Repo has too many branches
